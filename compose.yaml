services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3.2.39
    ports:
      - "127.0.0.1:${CLICKHOUSE_PORT:-18123}:8123"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?Set CLICKHOUSE_USER in your private .env file}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in your private .env file}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_repro:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
volumes:
  clickhouse_repro:
